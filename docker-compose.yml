
services:
  api:
    build: .
    ports:
      - "7000:7000"
    env_file:
      - .env
    environment:
      NODE_ENV: production,
      DB_URL: mongodb://mongo:27017/task_manager
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mongo_data:
